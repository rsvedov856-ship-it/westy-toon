<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESTY TOON</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>WESTY TOON</h1>
        <p class="subtitle">Твой адресник</p>

        <div class="form">
            <input type="text" id="name" placeholder="Имя">
            <input type="text" id="phone" placeholder="Телефон">
            <input type="text" id="email" placeholder="Email">
            <input type="text" id="note" placeholder="Заметка">
            <button id="addBtn">Добавить контакт</button>
        </div>

        <input type="text" id="search" placeholder="Поиск..." oninput="searchContacts()">

        <div id="contacts"></div>
        <p id="counter" class="counter"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
